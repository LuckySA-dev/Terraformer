[project]
name = "terraformer-backend"
version = "0.1.0"
description = "Local-first network automation backend"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.16.4",
  # Anthropic's own API is a different wire format, not just a different base
  # URL, so the OpenAI-compatible client below cannot reach Claude models with
  # a direct Anthropic key. This is the second provider adapter, not a
  # replacement -- see app/assistant/anthropic_client.py.
  "anthropic==1.1.0",
  "argon2-cffi==25.1.0",
  "asyncssh==2.23.1",
  "cryptography==45.0.5",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "openai==1.99.9",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "redis==6.2.0",
  "rq==2.4.1",
  "scrapli==2025.1.30",
  "sqlalchemy==2.0.41",
  "structlog==25.4.0",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
# Read-only configuration analysis. Still an extra so a plain `uv sync` stays
# small, but the runtime image installs it (backend/Dockerfile): keeping it out
# of the image made ANALYSIS_ENABLED a flag that could never do anything.
# Pinned to the latest PyPI release as of 2026-08-08; `pip index versions
# pybatfish` confirmed no newer release exists.
analysis = [
  "pybatfish==2025.7.7.2423",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pyright==1.1.403",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -p no:cacheprovider"
testpaths = ["tests"]
markers = [
  "integration: database/API integration tests",
  "lab: opt-in tests that require a real network device",
  "analysis: opt-in tests that require a running Batfish container",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["app"]
exclude = ["migrations"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
